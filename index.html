<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Olivo Bảo hành</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Bố cục: thanh trên + cột menu trái; điện thoại: menu thành dải tab cuộn ngang, bảng thành thẻ. */
:root{
  --bg:#f4f5ef; --panel:#ffffff; --sunk:#eceee4; --line:#dadecf; --fg:#1f2318; --muted:#5f6752;
  --accent:#4f5d1f; --accent-ink:#fbfcf6; --accent-soft:#e5e9d1;
  --ok:#2f7d32; --warn:#9a5800; --bad:#b3261e;
  --shadow:0 1px 2px rgba(30,35,20,.06),0 8px 24px rgba(30,35,20,.08);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13150f; --panel:#1b1e16; --sunk:#22261b; --line:#353b2b; --fg:#e7eadd; --muted:#a2aa92;
  --accent:#b7c66c; --accent-ink:#1a1d10; --accent-soft:#2c331c;
  --ok:#7fc682; --warn:#e3a84c; --bad:#f28b81; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13150f; --panel:#1b1e16; --sunk:#22261b; --line:#353b2b; --fg:#e7eadd; --muted:#a2aa92;
  --accent:#b7c66c; --accent-ink:#1a1d10; --accent-soft:#2c331c;
  --ok:#7fc682; --warn:#e3a84c; --bad:#f28b81; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:20px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}

/* Nút */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:var(--panel);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Ô nhập */
.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 10px;min-height:38px}
textarea.inp{min-height:76px;resize:vertical}
.inp:disabled,.inp[readonly]{background:var(--sunk);color:var(--muted)}
.inp.bad{border-color:var(--bad)}

/* Khung app */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.who{text-align:right;font-size:13px;line-height:1.3}
.who b{display:block}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 54px)}
.nav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--r);text-decoration:none;color:var(--fg);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Bộ lọc */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto;flex:1 1 220px}
.toolbar select.inp{flex:0 1 200px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pill .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.on .n{color:inherit;opacity:.75}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13px}

/* Nhãn giá trị có màu */
.badge{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;
  color:color-mix(in srgb,var(--c) 72%,var(--fg));background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:6px;padding:1px 8px;font-size:13px;margin:1px 0}
.tag .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px;font-size:15px;line-height:1}
.late{color:var(--bad);font-weight:600;font-size:12px;white-space:nowrap}

/* Bảng */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
tr.is-late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding-top:12px}
@media (max-width:760px){
  table.cards thead{display:none}
  table.cards tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:12px;border-bottom:1px solid var(--line)}
  table.cards td{border:0;padding:0;min-width:0}
  table.cards td::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  table.cards td.lead{grid-column:1/-1}
  table.cards td.lead::before{display:none}
  tr.is-late td:first-child{box-shadow:none}
  table.cards tr.is-late{box-shadow:inset 3px 0 0 var(--bad)}
}

/* Tổng quan */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px}
.tile.alert .v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:140px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;background:var(--c,var(--accent));border-radius:5px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Xem chi tiết */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:12px}
.dl .it{min-width:0}
.dl .it.wide{grid-column:1/-1}
.dl dt{font-size:12px;color:var(--muted)}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.tl{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;font-size:13px}
.tl .t{color:var(--muted);font-variant-numeric:tabular-nums}
.hist{margin-top:6px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.vhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.vhead .code{font-size:20px}

/* Drawer form */
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.dr-back{position:absolute;inset:0;background:rgba(15,18,10,.45)}
.dr-panel{position:relative;width:min(720px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dr-panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.dr-body{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px 20px;display:flex;flex-direction:column;gap:14px}
.dr-panel footer{display:flex;justify-content:flex-end;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 20px;background:var(--panel);border-top:1px solid var(--line)}
.fgrp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>label{font-size:13px;font-weight:500}
.fld .req{color:var(--bad)}
.fld .err{color:var(--bad);font-size:12px;min-height:0}
.fld .err:empty{display:none}
.lock{font-size:11px;color:var(--muted);font-weight:400}
.ms{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:6px}
.ms-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ms-head .btn{margin-left:auto}
.ms-panel{margin-top:6px;border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:6px}
.ms-list{max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.ms-item{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;width:100%}
.ms-item:hover{background:var(--sunk)}
.pl{display:flex;flex-direction:column;gap:6px}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:6px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imgs .im{position:relative}
.imgs .im img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.imgs .im button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1}
.upl{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border:1px dashed var(--muted);border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;text-align:center}

/* Hộp xác nhận, thông báo, xem ảnh */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(15,18,10,.5);padding:16px}
.modal .box{background:var(--panel);border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r);box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:var(--panel)}
.lb{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-height:90vh;border-radius:6px}

/* Cấu hình */
.optrow{display:grid;grid-template-columns:40px minmax(0,1fr) 70px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.optrow input[type=color]{width:36px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.optgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cfgf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}

/* Đăng nhập */
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login .hint{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:var(--r);padding:8px 10px}

@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.optgrid{grid-template-columns:minmax(0,1fr)}.cfgf{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));gap:4px;position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:15}
  .nav .grp{display:none}
  .nav a{white-space:nowrap}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--accent)}
  .nav .cnt{margin-left:6px}
  .who{display:none}
}
@media (max-width:560px){.fgrid,.dl{grid-template-columns:minmax(0,1fr)}.tl li{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:100px minmax(0,1fr) 30px}}
@media (prefers-reduced-motion:no-preference){.dr-panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer" class="drawer" hidden>
  <div class="dr-back" data-act="closeDrawer"></div>
  <aside class="dr-panel" role="dialog" aria-modal="true" aria-labelledby="drTitle">
    <header><h2 id="drTitle">Biểu mẫu</h2><button type="button" class="btn ghost" data-act="closeDrawer" aria-label="Đóng">✕</button></header>
    <div class="dr-body" id="drBody"></div>
    <footer><button type="button" class="btn" data-act="closeDrawer">Hủy</button><button type="button" class="btn primary" data-act="saveForm" id="btnSave">Lưu</button></footer>
  </aside>
</div>
<div id="modal" class="modal" hidden></div>
<div id="lb" class="lb" hidden data-act="lbClose"><img alt="Ảnh phóng to" id="lbImg"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileIn" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* =====================================================================
   OLIVO – QUẢN LÝ BẢO HÀNH (1 file, JS thuần)
   - Dữ liệu lưu trong localStorage của trình duyệt (mỗi máy một bản).
     Muốn chuyển máy: dùng Sao lưu / Khôi phục trong Cấu hình chung.
   - Mọi form, bảng, trang xem, xuất/nhập Excel đều sinh từ bảng *_FIELDS.
   ===================================================================== */

/* ---------- Lưu trữ ---------- */
// Mọi khóa có tiền tố "olivo." + số phiên bản để sao lưu/khôi phục gom được hết.
const P = 'olivo.';
const K = {
  tickets: P+'tickets.v1', products: P+'products.v1', users: P+'users.v1',
  opts: P+'opts.v1', cfg: P+'config.v1', seq: P+'seq.v1', rr: P+'rr.v1',
  session: P+'session.v1', theme: P+'theme.v1'
};
// Bộ nhớ dự phòng khi trình duyệt chặn localStorage (cửa sổ ẩn danh, xem trước…).
const MEM = {};
let warnedStore = false;
function lsGet(k){ try{ const v = localStorage.getItem(k); return v !== null ? v : (k in MEM ? MEM[k] : null); }catch(e){ return k in MEM ? MEM[k] : null; } }
function lsSet(k,v){
  MEM[k] = v;
  try{ localStorage.setItem(k,v); }
  catch(e){ if(!warnedStore){ warnedStore = true; toast('Trình duyệt không cho lưu lâu dài (bộ nhớ đầy hoặc bị chặn). Hãy Sao lưu thường xuyên.','err'); } }
}
function lsDel(k){ delete MEM[k]; try{ localStorage.removeItem(k); }catch(e){} }
function lsKeys(){
  const s = new Set(Object.keys(MEM));
  try{ for(let i=0;i<localStorage.length;i++) s.add(localStorage.key(i)); }catch(e){}
  return [...s].filter(k => k && k.startsWith(P));
}
function load(k,d){ try{ const v = lsGet(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k,v){ lsSet(k, JSON.stringify(v)); }

const DB = {};
function loadAll(){
  DB.tickets = load(K.tickets, null);
  DB.products = load(K.products, null);
  DB.users = load(K.users, null);
  DB.opts = load(K.opts, {});
  DB.cfg = Object.assign({ tenDonVi:'Olivo', hanXuLy:7, autoAssign:true }, load(K.cfg, {}));
}
function persist(name){ save(K[name], DB[name]); }

/* ---------- Tiện ích ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().trim();
const pad = n => String(n).padStart(2,'0');
function toLocalISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const nowLocal = () => toLocalISO(new Date());
const today = () => nowLocal().slice(0,10);
function fmtDate(s){
  if(!s) return '';
  const m = /^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d))?/.exec(s);
  if(!m) return String(s);
  return `${m[3]}/${m[2]}/${m[1]}` + (m[4] ? ` ${m[4]}:${m[5]}` : '');
}
function parseD(s){ if(!s) return null; const d = new Date(String(s).length === 10 ? s+'T00:00' : s); return isNaN(d) ? null : d; }
const daysBetween = (a,b) => Math.floor((b - a) / 86400000);
function addMonths(d,m){ const r = new Date(d); r.setMonth(r.getMonth() + m); return r; }
const fmtMoney = v => (v === '' || v == null || isNaN(v)) ? '' : Number(v).toLocaleString('vi-VN') + ' ₫';
// Băm đơn giản chỉ để không lưu mật khẩu dạng chữ thường; KHÔNG phải bảo mật thật
// (dữ liệu nằm trên máy người dùng, ai mở được trình duyệt là đọc được).
function hashPw(s){ let a = 0x811c9dc5, b = 0x9e3779b1; for(const ch of 'olivo:'+s){ const c = ch.codePointAt(0); a = Math.imul(a ^ c, 16777619) >>> 0; b = Math.imul(b + c, 2654435761) >>> 0; } return a.toString(16) + b.toString(16); }

// Đổi tên: cập nhật luôn mọi bản ghi đang dùng giá trị cũ để dữ liệu không bị "mồ côi".
function renameOpt(key,id,nv){
  nv = String(nv).trim(); const o = getOpts(key).find(x => x.id === id); if(!o || !nv || nv === o.v) return false;
  if(optByV(key,nv)){ toast('Giá trị “'+nv+'” đã có trong danh sách.','err'); return false; }
  const old = o.v; o.v = nv;
  for(const [coll,fields] of OPT_USES()){
    let changed = false;
    for(const r of DB[coll]) for(const [k,f] of Object.entries(fields)){
      if(f.opts !== key) continue;
      if(Array.isArray(r[k])){ const i = r[k].indexOf(old); if(i>=0){ r[k][i] = nv; changed = true; } }
      else if(r[k] === old){ r[k] = nv; changed = true; }
    }
    if(changed) persist(coll);
  }
  persist('opts'); return true;
}
// Xóa giá trị: bản ghi cũ vẫn giữ nguyên chữ đã lưu (hiện kèm "không còn trong danh sách").

function optUsage(key,v){
  let n = 0;
  for(const [coll,fields] of OPT_USES()) for(const r of DB[coll]) for(const [k,f] of Object.entries(fields)){
    if(f.opts !== key) continue;
    if(Array.isArray(r[k]) ? r[k].includes(v) : r[k] === v) n++;
  }
  return n;
}

const productOf = t => DB.products.find(p => p.ten === t.sanPham);
const userOf = u => DB.users.find(x => x.username === u);
const userName = u => u ? ((userOf(u) || {}).name || u) : '';
function warrantyInfo(t){
  const p = productOf(t), buy = parseD(t.ngayMua);
  if(!p || !buy || !(+p.thoiHanBH)) return null;
  const end = addMonths(buy, +p.thoiHanBH), ref = parseD(t.ngayNhan) || new Date();
  return { end, ok: ref <= end };
}
function daysOpen(t){
  const s = parseD(t.ngayNhan); if(!s) return null;
  const e = parseD(t.ngayTra) || parseD(t.ngayHoanThanh) || (isClosed(t) ? parseD(t.updatedAt) : null) || new Date();
  return Math.max(0, daysBetween(s, e));
}
// Quá hạn: phiếu chưa đóng mà đã quá số ngày cho phép (Cấu hình chung) hoặc đã qua ngày hẹn trả.
function isOverdue(t){
  if(isClosed(t)) return false;
  const s = parseD(t.ngayNhan);
  if(s && daysBetween(s, new Date()) > (+DB.cfg.hanXuLy || 7)) return true;
  const h = parseD(t.ngayHen);
  return !!(h && daysBetween(h, new Date()) > 0);
}
function autoText(key,t){
  if(key === 'code') return t.code || '(tự sinh khi lưu)';
  if(key === 'conHan'){ const w = warrantyInfo(t); if(!w) return 'Chưa đủ thông tin (cần sản phẩm + ngày mua)'; return (w.ok ? 'Còn hạn đến ' : 'Hết hạn từ ') + fmtDate(toLocalISO(w.end).slice(0,10)); }
  if(key === 'soNgay'){ const n = daysOpen(t); return n == null ? '' : n + ' ngày'; }
  return '';
}
function autoHTML(key,t){
  if(key === 'code') return `<span class="mono">${esc(autoText(key,t))}</span>`;
  if(key === 'conHan'){ const w = warrantyInfo(t); const s = esc(autoText(key,t)); return w ? `<span class="badge" style="--c:${w.ok ? 'var(--ok)' : 'var(--bad)'}">${s}</span>` : `<span class="muted">${s}</span>`; }
  if(key === 'soNgay'){ const s = esc(autoText(key,t)); return isOverdue(t) ? `${s} <span class="late">Quá hạn</span>` : s; }
  return '';
}
function nextCode(){
  const d = new Date(), ym = String(d.getFullYear()).slice(2) + pad(d.getMonth()+1);
  const seq = load(K.seq, {});
  let n = (seq[ym] || 0) + 1, code;
  do { code = `BH${ym}-${String(n).padStart(4,'0')}`; n++; } while(DB.tickets.some(t => t.code === code));
  seq[ym] = n - 1; save(K.seq, seq); return code;
}
// Chia việc xoay vòng cho kỹ thuật đang hoạt động cùng khu vực (người không ghi khu vực nhận mọi khu vực).
function pickTech(kv){
  const c = DB.users.filter(u => u.active && u.role === 'kythuat' && (!u.khuVuc || u.khuVuc === kv)).sort((a,b) => a.username.localeCompare(b.username));
  if(!c.length) return '';
  const rr = load(K.rr, {}), key = kv || '_';
  const i = c.findIndex(u => u.username === rr[key]);
  const next = c[(i + 1) % c.length];
  rr[key] = next.username; save(K.rr, rr);
  return next.username;
}

/* ---------- Thông báo, xác nhận, tải file ---------- */
function toast(msg,kind){
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), kind === 'err' ? 5000 : 2800);
}
// Hộp xác nhận tự dựng (trang artifact không hiện confirm() của trình duyệt).
function askConfirm({title, body, ok = 'Đồng ý', danger = false}){
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="box" role="alertdialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">${esc(title)}</h2><div>${body}</div><div class="row"><button type="button" class="btn" id="mNo">Hủy</button><button type="button" class="btn ${danger ? 'danger solid' : 'primary'}" id="mYes">${esc(ok)}</button></div></div>`;
    m.hidden = false; $('#mYes').focus();
    const done = v => { m.hidden = true; m.innerHTML = ''; res(v); };
    $('#mNo').onclick = () => done(false); $('#mYes').onclick = () => done(true);
    m.onclick = e => { if(e.target === m) done(false); };
  });
}
// Trong artifact claude.ai thẻ <a download> bị chặn → dùng capability "downloads"; ngoài đó dùng link thường.
async function saveFile(filename, data){
  try{
    if(window.claude && window.claude.use){
      const dl = await window.claude.use('downloads');
      if(dl){
        try{ await dl.save({filename, data}); toast('Đã xuất ' + filename); }
        catch(e){ if(e && e.code !== 'declined') toast('Không xuất được file: ' + (e.message || e.code), 'err'); }
        return;
      }
    }
  }catch(e){}
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function pickFile(accept, cb){
  const f = $('#fileIn'); f.value = ''; f.accept = accept; f.multiple = false;
  f.onchange = () => { if(f.files[0]) cb(f.files[0]); };
  f.click();
}

/* ---------- Hiển thị giá trị ---------- */
function showVal(fields,key,r){
  const f = fields[key], v = r[key];
  switch(f.type){
    case 'auto': return autoHTML(key,r);
    case 'select':
      if(f.fixed) return esc((f.fixed.find(x => x.v === v) || {}).l || v || '');
      if(!v) return f.emptyLabel ? `<span class="muted">${esc(f.emptyLabel)}</span>` : '';
      return valueBadge(f.opts, v) + (optByV(f.opts, v) ? '' : ' <span class="muted">(không còn trong danh sách)</span>');
    case 'date': case 'datetime': return `<span class="num">${esc(fmtDate(v))}</span>`;
    case 'money': return `<span class="num">${esc(fmtMoney(v))}</span>`;
    case 'number': return `<span class="num">${esc(v ?? '')}</span>`;
    case 'accessoryCheck': return (v || []).map(x => `<span class="tag">${esc(x)}</span>`).join(' ');
    case 'images': return (v || []).length ? `<div class="thumbs">${v.map((s,i) => `<img src="${esc(s)}" alt="Ảnh ${i+1}" data-act="imgOpen">`).join('')}</div>` : '';
    case 'pairList': return (v || []).filter(p => p.a).map(p => `${esc(p.a)} × <span class="num">${esc(p.b || 1)}</span>`).join('<br>');
    case 'userSelect': return v ? esc(userName(v)) : '<span class="muted">Chưa giao</span>';
    case 'catalogSelect': return esc(v || '') + (v && !productOf(r) ? ' <span class="muted">(không còn trong danh mục)</span>' : '');
    case 'bool': return v ? 'Có' : 'Không';
    case 'password': return '••••••';
    default: return esc(v ?? '').replace(/\n/g,'<br>');
  }
}
// Giá trị dạng chữ cho Excel.
function plainVal(fields,key,r){
  const f = fields[key], v = r[key];
  switch(f.type){
    case 'auto': return autoText(key,r);
    case 'select': return f.fixed ? ((f.fixed.find(x => x.v === v) || {}).l || v || '') : (v || '');
    case 'date': case 'datetime': return fmtDate(v);
    case 'accessoryCheck': return (v || []).join(', ');
    case 'pairList': return (v || []).filter(p => p.a).map(p => `${p.a} x ${p.b || 1}`).join('; ');
    case 'userSelect': return userName(v);
    case 'bool': return v ? 'Có' : 'Không';
    case 'images': return (v || []).length ? `${v.length} ảnh` : '';
    default: return v ?? '';
  }
}

/* ---------- Bảng + phân trang chung ---------- */
function tableHTML(kind, cols, rows, opts = {}){
  const F = KINDS[kind].fields;
  if(!rows.length) return `<div class="card empty">${opts.empty || 'Chưa có dữ liệu.'}</div>`;
  const st = opts.state, total = rows.length, pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(st.page > pages) st.page = pages;
  const slice = rows.slice((st.page-1)*PAGE_SIZE, st.page*PAGE_SIZE);
  const head = cols.map(k => `<th>${esc(F[k].label)}</th>`).join('') + (opts.actions ? '<th></th>' : '');
  const body = slice.map(r => `<tr class="${opts.rowAct ? 'click' : ''} ${opts.late && opts.late(r) ? 'is-late' : ''}" ${opts.rowAct ? `data-act="${opts.rowAct}" data-id="${r.id}" tabindex="0"` : ''}>` +
    cols.map((k,i) => `<td data-l="${esc(F[k].label)}" class="${i === 0 ? 'lead' : ''}">${showVal(F,k,r)}</td>`).join('') +
    (opts.actions ? `<td data-l="">${opts.actions(r)}</td>` : '') + '</tr>').join('');
  let pager = '';
  if(pages > 1){
    pager = `<div class="pager"><span class="muted num">${(st.page-1)*PAGE_SIZE+1}–${Math.min(st.page*PAGE_SIZE,total)} / ${total}</span>
      <button type="button" class="btn sm" data-act="page" data-p="${st.page-1}" ${st.page <= 1 ? 'disabled' : ''}>‹ Trước</button>
      <span class="num">${st.page}/${pages}</span>
      <button type="button" class="btn sm" data-act="page" data-p="${st.page+1}" ${st.page >= pages ? 'disabled' : ''}>Sau ›</button></div>`;
  }
  return `<div class="card" style="padding:4px 8px 8px"><div class="tw"><table class="cards"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${pager}</div>`;
}

function ticketMatches(t,q){

}
function renderTickets(){

  if(L.mine === null) L.mine = ME.role === 'kythuat';

  let base = DB.tickets.filter(t => ticketMatches(t,q) && (!L.tech || (L.tech === '_none' ? !t.kyThuat : t.kyThuat === L.tech)) && (!L.mine || t.kyThuat === ME.username));

function renderTicketView(t){
  const F = T_FIELDS;
  const groups = T_GROUPS.map(g => {
    const items = g.keys.filter(k => !F[k].showIf || F[k].showIf(t)).map(k => {
      const v = showVal(F,k,t);
      return `<div class="it ${F[k].wide ? 'wide' : ''}"><dt>${esc(F[k].label)}</dt><dd>${v || '<span class="muted">—</span>'}</dd></div>`;
    }).join('');
    return `<div class="card"><h3>${esc(g.t)}</h3><dl class="dl">${items}</dl></div>`;
  }).join('');
  const ev = [];
  for(const [k,list] of Object.entries(t.hist || {})) for(const h of list){
    const fv = x => k === 'kyThuat' ? (userName(x) || 'Chưa giao') : (x || '—');
    ev.push({t:h.t, html:`<b>${esc(F[k] ? F[k].label : k)}</b>: ${h.from ? esc(fv(h.from)) + ' → ' : ''}${k === 'trangThai' ? valueBadge('trangThai', h.to) : esc(fv(h.to))} <span class="muted">· ${esc(userName(h.by) || h.by)}</span>`});
  }
  ev.sort((a,b) => b.t.localeCompare(a.t));
  const editable = can.editTicket(t);
  return `<div class="page">
    <div><a href="#phieu" data-act="backList">‹ Danh sách phiếu</a></div>
    <div class="ph">
      <div class="vhead"><span class="mono code">${esc(t.code)}</span>${valueBadge('trangThai', t.trangThai)}${isOverdue(t) ? '<span class="late">Quá hạn</span>' : ''}</div>

function closeForm(){ F = null; $('#drawer').hidden = true; document.body.style.overflow = ''; }
function fieldHTML(key){

        ${dis || arr.length >= 6 ? '' : `<label class="upl" for="${id}">+ Ảnh<br>(tối đa 6)</label><input type="file" id="${id}" accept="image/*" multiple data-img="${key}" hidden>`}</div>`;

      inp = `<div class="pl">${arr.map((p,i) => `<div class="pl-row"><input class="inp" id="${id}_a${i}" data-pl="${key}" data-i="${i}" data-j="a" value="${esc(p.a)}" placeholder="Tên linh kiện" ${dis} aria-label="Tên linh kiện ${i+1}"><input class="inp" id="${id}_b${i}" type="number" min="1" data-pl="${key}" data-i="${i}" data-j="b" value="${esc(p.b ?? 1)}" ${dis} aria-label="Số lượng"><button type="button" class="btn sm ghost" data-act="plDel" data-k="${key}" data-i="${i}" ${dis} aria-label="Xóa dòng">✕</button></div>`).join('')}

    default: {

      const extra = f.type === 'money' ? 'min="0" step="1000" inputmode="numeric"' : f.type === 'number' ? 'min="0"' : '';

  const hist = (F.orig && F.orig.hist && F.orig.hist[key] || []).slice(-3).reverse()
    .map(h => `<span>${esc(fmtDate(h.t))} · ${esc(userName(h.by) || h.by)}: ${esc(key === 'kyThuat' ? userName(h.from) || '—' : h.from || '—')} → ${esc(key === 'kyThuat' ? userName(h.to) || '—' : h.to)}</span>`).join('');
  return `<div class="fld ${f.wide ? 'wide' : ''}"><label for="${id}">${esc(label)}${req ? ' <span class="req">*</span>' : ''}${lock}</label>${inp}<div class="err" id="err_${key}">${esc(F.errs[key] || '')}</div>${hist ? `<div class="hist">${hist}</div>` : ''}</div>`;
}
function msWidget(k, f, sel, dis){
  const open = F.ms.open === k;
  const chips = sel.map(v => `<span class="tag">${esc(v)}${dis ? '' : `<button type="button" class="x" data-act="msRemove" data-k="${k}" data-v="${esc(v)}" aria-label="Bỏ ${esc(v)}">×</button>`}</span>`).join('') || '<span class="muted">Chưa chọn</span>';
  return `<div class="ms" id="f_${k}"><div class="ms-head">${chips}${dis ? '' : `<button type="button" class="btn sm" data-act="msToggle" data-k="${k}" aria-expanded="${open}">${open ? 'Xong' : 'Chọn…'}</button>`}</div>
    ${open ? `<div class="ms-panel"><input class="inp" id="msq_${k}" data-msq="${k}" placeholder="Tìm hoặc gõ giá trị mới…" value="${esc(F.ms.q)}" aria-label="Tìm phụ kiện"><div class="ms-list" id="msl_${k}">${msList(k, f, sel)}</div></div>` : ''}</div>`;
}
function msList(k, f, sel){
  const q = norm(F.ms.q);
  const all = [...new Set([...getOpts(f.opts).map(o => o.v), ...sel])];
  let h = all.filter(v => !q || norm(v).includes(q)).map(v => `<label class="ms-item"><input type="checkbox" data-msk="${k}" value="${esc(v)}" ${sel.includes(v) ? 'checked' : ''}> ${esc(v)}</label>`).join('');
  if(F.ms.q.trim() && !all.some(v => norm(v) === q)) h += `<button type="button" class="btn sm" data-act="msAddNew" data-k="${k}">+ Thêm “${esc(F.ms.q.trim())}”</button>`;
  return h || '<div class="muted">Không có giá trị phù hợp.</div>';
}
function drawForm(){
  const body = $('#drBody'), st = body.scrollTop;
  const a = document.activeElement, fid = a && body.contains(a) ? a.id : null;
  const sel = fid && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  const kd = KINDS[F.kind];
  body.innerHTML = kd.groups.map(g => {
    const keys = g.keys.filter(k => !kd.fields[k].showIf || kd.fields[k].showIf(F.d));
    return `<section class="fgrp"><h3>${esc(g.t)}</h3><div class="fgrid">${keys.map(fieldHTML).join('')}</div></section>`;
  }).join('');
  body.scrollTop = st;
  if(fid){ const el = document.getElementById(fid); if(el){ el.focus(); if(sel) try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
}
function readInput(el){
  const f = KINDS[F.kind].fields[el.dataset.k];
  if(f.type === 'bool') return el.checked;
  if(f.type === 'number' || f.type === 'money') return el.value === '' ? '' : Number(el.value);
  return el.value;
}
// Các trường mà đổi giá trị thì phải vẽ lại form (tự điền, hiện/ẩn trường phụ thuộc, tự tính).
const REDRAW_ON = ['sanPham','trangThai','ngayMua','ngayNhan','khuVuc'];
function onFormChange(key){
  const d = F.d;
  if(F.kind === 'ticket'){
    if(key === 'sanPham'){ const p = productOf(d); d.maSP = p ? (p.ma || '') : ''; d.nhomSP = p ? (p.nhom || '') : ''; }
    if(key === 'trangThai') applyStatusDates(d);
  }
  if(REDRAW_ON.includes(key)) drawForm();
}
const drBody = $('#drBody');
drBody.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.k && el.type !== 'checkbox' && el.tagName !== 'SELECT'){ F.d[el.dataset.k] = readInput(el); const er = $('#err_' + el.dataset.k); if(er) er.textContent = ''; el.classList.remove('bad'); }
  else if(el.dataset.pl){ const k = el.dataset.pl, i = +el.dataset.i; F.d[k] = (F.d[k] && F.d[k].length) ? F.d[k] : [{a:'', b:1}]; F.d[k][i][el.dataset.j] = el.dataset.j === 'b' ? (el.value === '' ? '' : Number(el.value)) : el.value; }
  else if(el.dataset.msq){ F.ms.q = el.value; const k = el.dataset.msq; $('#msl_' + k).innerHTML = msList(k, KINDS[F.kind].fields[k], F.d[k] || []); }
});
drBody.addEventListener('change', async e => {
  const el = e.target;
  if(el.dataset.k){ F.d[el.dataset.k] = readInput(el); onFormChange(el.dataset.k); }
  else if(el.dataset.msk){ const k = el.dataset.msk, arr = F.d[k] = F.d[k] || []; const i = arr.indexOf(el.value); if(el.checked && i < 0) arr.push(el.value); if(!el.checked && i >= 0) arr.splice(i,1); drawForm(); }
  else if(el.dataset.img){
    const k = el.dataset.img, arr = F.d[k] = F.d[k] || [];
    const files = [...el.files].slice(0, 6 - arr.length);
    for(const file of files){ try{ arr.push(await resizeImg(file)); }catch(err){ toast('Không đọc được ảnh “' + file.name + '”.', 'err'); } }
    drawForm();
  }
});
drBody.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.dataset.msq){ e.preventDefault(); ACT.msAddNew({dataset:{k:e.target.dataset.msq}}); } });
// Thu nhỏ ảnh trước khi lưu để không làm đầy bộ nhớ trình duyệt.
function resizeImg(file, max = 1024, q = .72){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width*s), h = Math.round(im.height*s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im,0,0,w,h);
      res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function validate(){
  const kd = KINDS[F.kind], d = F.d, errs = {};
  for(const [k,f] of Object.entries(kd.fields)){
    if(f.showIf && !f.showIf(d)) continue;
    const v = d[k];
    if(f.req && (v === '' || v == null || (Array.isArray(v) && !v.length))) errs[k] = 'Vui lòng nhập ' + f.label.toLowerCase() + '.';
  }
  if(F.kind === 'ticket'){
    if(d.sdt && !/^[0-9+().\s-]{8,15}$/.test(d.sdt)) errs.sdt = 'Số điện thoại gồm 8–15 chữ số.';
    if(d.ngayMua && d.ngayNhan && d.ngayMua > d.ngayNhan.slice(0,10)) errs.ngayMua = 'Ngày mua không thể sau ngày tiếp nhận.';
    if(d.chiPhi !== '' && d.chiPhi != null && d.chiPhi < 0) errs.chiPhi = 'Chi phí không được âm.';
  }
  if(F.kind === 'product'){
    d.ten = (d.ten || '').trim();
    if(d.ten && DB.products.some(p => p.id !== F.id && norm(p.ten) === norm(d.ten))) errs.ten = 'Đã có sản phẩm cùng tên.';
    if(d.thoiHanBH !== '' && d.thoiHanBH < 0) errs.thoiHanBH = 'Thời hạn không được âm.';
  }
  if(F.kind === 'user'){
    d.username = (d.username || '').trim().toLowerCase();
    if(d.username && !/^[a-z0-9._-]{3,30}$/.test(d.username)) errs.username = 'Chỉ dùng chữ thường không dấu, số, dấu chấm, gạch; tối thiểu 3 ký tự.';
    else if(d.username && DB.users.some(u => u.id !== F.id && u.username === d.username)) errs.username = 'Tên đăng nhập đã tồn tại.';
    if(!F.id && !d.password) errs.password = 'Vui lòng đặt mật khẩu.';
    if(d.password && d.password.length < 6) errs.password = 'Mật khẩu tối thiểu 6 ký tự.';
    // Luôn phải còn ít nhất 1 quản trị đang hoạt động, nếu không sẽ không ai vào được Cấu hình.
    const others = DB.users.filter(u => u.id !== F.id && u.role === 'admin' && u.active).length;
    if(F.id && !others && !(d.role === 'admin' && d.active)) errs.role = 'Phải còn ít nhất một quản trị đang hoạt động.';
  }
  return errs;
}
function saveForm(){
  const errs = validate(); F.errs = errs;
  if(Object.keys(errs).length){
    drawForm();
    const first = $('#drBody .err:not(:empty)');
    if(first){ first.scrollIntoView({block:'center'}); const inp = first.parentElement.querySelector('.inp'); if(inp){ inp.classList.add('bad'); } }
    toast('Còn ' + Object.keys(errs).length + ' ô cần sửa.', 'err');
    return;
  }
  const kd = KINDS[F.kind], d = F.d, isNew = !F.id, kind = F.kind;
  if(kind === 'ticket'){
    if(isNew){
      d.id = uid(); d.code = nextCode(); d.createdBy = ME.username;
      if(!d.kyThuat && DB.cfg.autoAssign) d.kyThuat = pickTech(d.khuVuc);
      d.hist = {}; pushHist(d, 'trangThai', '', d.trangThai);
      if(d.kyThuat) pushHist(d, 'kyThuat', '', d.kyThuat);
      d.updatedAt = nowLocal();
      DB.tickets.push(d);
    } else {
      for(const [k,f] of Object.entries(T_FIELDS)) if(f.hist && (F.orig[k] || '') !== (d[k] || '')) pushHist(d, k, F.orig[k], d[k]);
      d.updatedAt = nowLocal();
      DB.tickets[DB.tickets.findIndex(t => t.id === F.id)] = d;
    }
    d.linhKien = (d.linhKien || []).filter(p => String(p.a || '').trim());
    persist('tickets');
  } else if(kind === 'product'){
    if(isNew){ d.id = uid(); DB.products.push(d); }
    else {
      // Đổi tên sản phẩm → cập nhật các phiếu đang dùng tên cũ.
      if(F.orig.ten !== d.ten){ DB.tickets.forEach(t => { if(t.sanPham === F.orig.ten) t.sanPham = d.ten; }); persist('tickets'); }
      DB.products[DB.products.findIndex(p => p.id === F.id)] = d;
    }
    delete d.sample; persist('products');
  } else {
    if(d.password) d.pw = hashPw(d.password);
    delete d.password;
    if(isNew){ d.id = uid(); DB.users.push(d); }
    else {
      if(F.orig.username !== d.username){ DB.tickets.forEach(t => { if(t.kyThuat === F.orig.username) t.kyThuat = d.username; }); persist('tickets'); }
      DB.users[DB.users.findIndex(u => u.id === F.id)] = d;
      if(ME.id === d.id){ ME = d; save(K.session, {u:d.username}); }
    }
    persist('users');
  }
  toast(isNew ? 'Đã thêm ' + kd.name + (d.code ? ' ' + d.code : '') + (kind === 'ticket' && d.kyThuat ? ', giao cho ' + userName(d.kyThuat) : '') : 'Đã lưu thay đổi.');
  // Sửa phiếu xong → về trang xem phiếu đó; thêm mới → về danh sách.
  if(kind === 'ticket'){ VIEW = isNew ? null : {kind:'ticket', id:d.id}; if(isNew && location.hash !== '#phieu'){ closeForm(); location.hash = '#phieu'; return; } }
  closeForm(); draw();
}

/* ---------- Excel ---------- */
const TICKET_XLS = Object.keys(T_FIELDS).filter(k => !['images'].includes(T_FIELDS[k].type));
function needXLSX(){ if(window.XLSX) return true; toast('Chưa tải được thư viện Excel. Kiểm tra mạng rồi thử lại.', 'err'); return false; }
function exportXlsx(kind, keys, rows, name){
  if(!needXLSX()) return;
  const F = KINDS[kind].fields;
  const data = rows.map(r => Object.fromEntries(keys.map(k => [F[k].label, plainVal(F,k,r)])));
  const ws = XLSX.utils.json_to_sheet(data, {header: keys.map(k => F[k].label)});
  ws['!cols'] = keys.map(k => ({wch: Math.min(40, Math.max(10, F[k].label.length + 2))}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  saveFile(`${name}-${today()}.xlsx`, new Uint8Array(buf));
}
function cellToISO(v, withTime){
  if(v === '' || v == null) return '';
  if(v instanceof Date && !isNaN(v)){ const s = toLocalISO(v); return withTime ? s : s.slice(0,10); }
  const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(v).trim());
  if(m){ const s = `${m[3]}-${pad(m[2])}-${pad(m[1])}` + (withTime ? `T${pad(m[4] || 0)}:${m[5] || '00'}` : ''); return s; }
  const d = parseD(String(v)); return d ? (withTime ? toLocalISO(d) : toLocalISO(d).slice(0,10)) : '';
}
function readSheet(file){
  return file.arrayBuffer().then(buf => {
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:true});
  });
}
// Nhập phiếu: khớp theo Mã phiếu thì cập nhật, không có mã thì tạo mới. Bỏ qua dòng thiếu ô bắt buộc.
async function importTickets(file){
  if(!needXLSX()) return;
  let rows; try{ rows = await readSheet(file); }catch(e){ toast('Không đọc được file Excel.', 'err'); return; }
  const byLabel = Object.fromEntries(Object.entries(T_FIELDS).map(([k,f]) => [norm(f.label), k]));
  let added = 0, updated = 0, skipped = 0;
  for(const row of rows){
    const d = {};
    for(const [h,v] of Object.entries(row)){
      const k = byLabel[norm(h)]; if(!k) continue; const f = T_FIELDS[k];
      if(f.type === 'auto' && k !== 'code') continue;
      if(f.type === 'date' || f.type === 'datetime') d[k] = cellToISO(v, f.type === 'datetime');
      else if(f.type === 'accessoryCheck') d[k] = String(v).split(/[,;]/).map(s => s.trim()).filter(Boolean);
      else if(f.type === 'pairList') d[k] = String(v).split(';').map(s => s.trim()).filter(Boolean).map(s => { const m = /^(.*?)\s*x\s*(\d+)$/i.exec(s); return m ? {a:m[1], b:+m[2]} : {a:s, b:1}; });
      else if(f.type === 'money' || f.type === 'number') d[k] = v === '' ? '' : Number(String(v).replace(/[^\d.-]/g,''));
      else if(f.type === 'userSelect'){ const u = DB.users.find(x => x.username === String(v).trim() || norm(x.name) === norm(v)); d[k] = u ? u.username : ''; }
      else d[k] = String(v).trim();
    }
    const ex = d.code && DB.tickets.find(t => t.code === d.code);
    if(ex){
      for(const [k,f] of Object.entries(T_FIELDS)) if(f.hist && k in d && (ex[k] || '') !== (d[k] || '')) pushHist(ex, k, ex[k], d[k]);
      Object.assign(ex, d, {updatedAt: nowLocal()}); updated++;
    } else {
      if(!d.khachHang || !d.sdt || !d.sanPham || !d.moTaLoi){ skipped++; continue; }
      const t = Object.assign({phuKien:[], hinhAnh:[], linhKien:[], kyThuat:''}, d);
      t.id = uid(); t.code = nextCode(); t.ngayNhan = t.ngayNhan || nowLocal();
      t.trangThai = t.trangThai || (getOpts('trangThai')[0] || {}).v || '';
      t.loaiBH = t.loaiBH || 'Bảo hành';
      const p = productOf(t); if(p){ t.maSP = t.maSP || p.ma; t.nhomSP = t.nhomSP || p.nhom; }
      t.createdBy = ME.username; t.hist = {}; pushHist(t, 'trangThai', '', t.trangThai); t.updatedAt = nowLocal();
      DB.tickets.push(t); added++;
    }
    for(const k of ['khuVuc','hinhThuc','mucUuTien','loaiBH']) if(d[k]) addOptIfNew(k, d[k]);
  }
  persist('tickets'); draw();
  toast(`Nhập xong: ${added} phiếu mới, ${updated} cập nhật${skipped ? `, bỏ qua ${skipped} dòng thiếu thông tin` : ''}.`, skipped ? 'err' : '');
}
async function importProducts(file){
  if(!needXLSX()) return;
  let rows; try{ rows = await readSheet(file); }catch(e){ toast('Không đọc được file Excel.', 'err'); return; }
  const byLabel = Object.fromEntries(Object.entries(P_FIELDS).map(([k,f]) => [norm(f.label), k]));
  let added = 0, updated = 0, skipped = 0;
  for(const row of rows){
    const d = {};
    for(const [h,v] of Object.entries(row)){ const k = byLabel[norm(h)]; if(k) d[k] = k === 'thoiHanBH' ? (v === '' ? '' : Number(v)) : String(v).trim(); }
    if(!d.ten){ skipped++; continue; }
    if(d.nhom) addOptIfNew('nhomSP', d.nhom);
    const ex = DB.products.find(p => norm(p.ten) === norm(d.ten));
    if(ex){ Object.assign(ex, d); updated++; } else { DB.products.push(Object.assign({id:uid(), ma:'', nhom:'', thoiHanBH:12, ghiChu:''}, d)); added++; }
  }
  persist('products'); draw();
  toast(`Nhập xong: ${added} sản phẩm mới, ${updated} cập nhật${skipped ? `, bỏ qua ${skipped} dòng không có tên` : ''}.`);
}

/* ---------- Sao lưu / khôi phục ---------- */
function backup(){
  const data = {};
  for(const k of lsKeys()) if(k !== K.session && k !== K.theme) data[k] = lsGet(k);
  saveFile(`olivo-bao-hanh-sao-luu-${today()}.json`, JSON.stringify({app:'olivo-bao-hanh', at:nowLocal(), data}, null, 1));
}
async function restore(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); }catch(e){ toast('File không phải JSON hợp lệ.', 'err'); return; }
  const data = obj && obj.data;
  if(!data || obj.app !== 'olivo-bao-hanh' || typeof data !== 'object'){ toast('File không phải bản sao lưu của app này.', 'err'); return; }
  if(Object.keys(data).some(k => !k.startsWith(P) || typeof data[k] !== 'string')){ toast('File sao lưu có dữ liệu lạ, đã dừng.', 'err'); return; }
  let users, tickets;
  try{ users = JSON.parse(data[K.users] || 'null'); tickets = JSON.parse(data[K.tickets] || '[]'); }catch(e){ toast('File sao lưu bị hỏng.', 'err'); return; }
  if(!Array.isArray(users) || !users.some(u => u.role === 'admin' && u.active)){ toast('Bản sao lưu không có quản trị nào đang hoạt động, không thể khôi phục.', 'err'); return; }
  const ok = await askConfirm({title:'Khôi phục dữ liệu?', danger:true, ok:'Ghi đè và khôi phục',
    body:`<p>Bản sao lưu lúc <b>${esc(fmtDate(obj.at))}</b>: ${Array.isArray(tickets) ? tickets.length : 0} phiếu, ${users.length} người dùng.</p><p>Toàn bộ dữ liệu hiện tại trên máy này sẽ bị <b>thay thế</b>. Nên Sao lưu bản hiện tại trước.</p>`});
  if(!ok) return;
  const snap = {}; for(const k of lsKeys()) snap[k] = lsGet(k);
  try{
    for(const k of Object.keys(snap)) if(k !== K.session && k !== K.theme) lsDel(k);
    for(const [k,v] of Object.entries(data)){ MEM[k] = v; localStorage.setItem(k, v); }
  }catch(e){
    // Lỗi giữa chừng → trả lại nguyên trạng.
    for(const k of lsKeys()) lsDel(k);
    for(const [k,v] of Object.entries(snap)) lsSet(k, v);
    toast('Khôi phục thất bại (' + (e.message || 'lỗi lưu') + '). Dữ liệu cũ được giữ nguyên.', 'err'); return;
  }
  loadAll();
  const s = load(K.session, null); ME = s ? DB.users.find(u => u.username === s.u && u.active) || null : null;
  if(!ME) lsDel(K.session);
  VIEW = null; draw(); toast('Đã khôi phục dữ liệu.');
}

    if(k === 'hanXuLy'){ const n = parseInt(el.value, 10); if(!(n >= 1)){ toast('Hạn xử lý phải từ 1 ngày.', 'err'); draw(); return; } DB.cfg.hanXuLy = n; }
    else if(k === 'autoAssign') DB.cfg.autoAssign = el.checked;
    else DB.cfg[k] = el.value.trim() || 'Olivo';
    persist('cfg'); draw(); toast('Đã lưu cấu hình.');
  }
});

/* ---------- Khởi động ---------- */
(function boot(){
  const th = lsGet(K.theme); if(th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  const s = load(K.session, null);
  if(s){ ME = DB.users.find(u => u.username === s.u && u.active) || null; }
  draw();
})();
</script>
